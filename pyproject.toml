[project]
name = "nudge-proto-type"
version = "0.1.0"
description = "NUDGE helps students overcome learning inertia and procrastination caused by large or complex study goals."
readme = "README.md"
requires-python = ">=3.13"

dependencies = [
    "dotenv>=0.9.9",
    "fastapi>=0.141.1",
    "openai>=3.14.0",
    "sqlmodel>=0.0.42",
    "uvicorn[standard]>=0.53.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = [
    "src",
    "src.api",
    "src.api.routes",
    "src.core",
    "src.db",
    "src.llm",
    "src.services",
    "tests",
]

[project.scripts]

test = "tests.integration_test:run_integration_test"
