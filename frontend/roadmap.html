<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Roadmap - NUDGE_AI</title>
    <link rel="icon" href="data:,🎯">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #f8fafc; }
        .node-line { position: absolute; left: 2.25rem; top: 3rem; bottom: -1rem; width: 2px; background-color: #e2e8f0; z-index: 0; }
        .node-line.completed { background-color: #10b981; }
    </style>
</head>
<body class="text-slate-800 min-h-screen flex flex-col">

    <nav class="w-full bg-white border-b border-slate-200 py-4 px-6 flex justify-between items-center sticky top-0 z-50">
        <div class="flex items-center gap-2">
            <span class="text-xl">🎯</span>
            <span class="text-lg font-bold text-slate-900 tracking-tight">NUDGE_AI</span>
        </div>
        <button onclick="localStorage.clear(); window.location.href='index.html'" class="text-sm font-semibold text-slate-500 hover:text-red-500 transition px-3 py-1 rounded-md hover:bg-red-50">End Session</button>
    </nav>

    <main class="flex-1 w-full max-w-3xl mx-auto px-4 py-10">

        <div id="roadmap-view">
            <div class="mb-10">
                <p class="text-sm font-bold text-blue-600 uppercase tracking-wider mb-2">Learning Path</p>
                <h1 class="text-3xl sm:text-4xl font-extrabold text-slate-900 mb-6" id="topic-display">Loading Topic...</h1>

                <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-200 flex items-center justify-between">
                    <span class="text-sm font-semibold text-slate-600">Current Part</span>
                    <span id="part-badge" class="bg-blue-100 text-blue-700 font-bold px-4 py-1.5 rounded-full text-sm">Part 1</span>
                </div>
            </div>

            <div class="bg-white p-6 sm:p-10 rounded-3xl shadow-sm border border-slate-200 relative mb-6">
                <div id="roadmap-container" class="flex flex-col gap-6"></div>
            </div>

            <div class="text-center">
                <button onclick="finishForNow()" class="text-sm font-semibold text-slate-400 hover:text-slate-600 transition">
                    Finish for now 🎉
                </button>
            </div>
        </div>

        <div id="finished-view" class="hidden text-center bg-white p-10 rounded-3xl shadow-sm border border-slate-200 max-w-md mx-auto">
            <div class="text-5xl mb-4">💾</div>
            <h2 class="text-2xl font-bold text-slate-800 mb-2">Progress Saved!</h2>
            <p class="text-slate-500 mb-4 text-sm leading-relaxed">
                Your journey is safely stored in our database. You can close this tab and return later using your browser, or save your Session ID.
            </p>
            
            <div class="bg-slate-50 border border-slate-200 rounded-xl p-3 mb-6 flex items-center justify-between">
                <span class="text-xs font-mono text-slate-500 truncate mr-2" id="display-session-id">Loading ID...</span>
                <button id="copy-btn" onclick="copySessionId()" class="text-blue-600 hover:text-blue-800 text-xs font-bold px-2 py-1 bg-blue-100 rounded-md transition">
                    Copy
                </button>
            </div>

            <div class="flex flex-col gap-3">
                <button id="close-btn" onclick="closeSafely()" class="w-full bg-slate-100 text-slate-700 font-bold py-3 px-8 rounded-xl hover:bg-slate-200 transition-colors">
                    Close & Leave
                </button>
                <button onclick="localStorage.clear(); window.location.href='index.html'" class="w-full bg-slate-900 text-white font-bold py-3 px-8 rounded-xl hover:bg-blue-600 transition-colors shadow-md">
                    Discard & Start New
                </button>
            </div>
        </div>
    </main>

    <script>
        let topic = localStorage.getItem("topic") || "New Topic";
        let currentPart = Number(localStorage.getItem("current_part")) || 1;
        let currentTitle = localStorage.getItem("title") || "Basic Concepts";
        let completedParts = JSON.parse(localStorage.getItem("completed_parts") || "[]");

        document.getElementById('topic-display').innerText = topic;
        document.getElementById('part-badge').innerText = `Part ${currentPart}`;

        let container = document.getElementById('roadmap-container');
        let htmlStr = "";

        completedParts.forEach(p => {
            htmlStr += `
                <div class="relative flex gap-5">
                    <div class="node-line completed"></div>
                    <div class="z-10 w-12 h-12 rounded-full bg-emerald-100 border-2 border-emerald-500 text-emerald-600 flex items-center justify-center font-bold text-xl shrink-0 shadow-sm">✓</div>
                    <div class="pt-2 pb-6">
                        <h3 class="text-lg font-bold text-slate-800">Part ${p.part_number}: ${p.title}</h3>
                        <p class="text-sm font-medium text-emerald-600 mt-1">Completed</p>
                    </div>
                </div>
            `;
        });

        htmlStr += `
            <div class="relative flex gap-5">
                <div class="z-10 w-12 h-12 rounded-full bg-blue-600 text-white flex items-center justify-center font-bold text-xl shrink-0 shadow-lg shadow-blue-500/40 ring-4 ring-blue-100">
                    ${currentPart}
                </div>
                <div class="pt-2 pb-6 flex-1">
                    <h3 class="text-xl font-bold text-slate-900">Part ${currentPart}: ${currentTitle}</h3>
                    <p class="text-sm text-slate-500 mt-1 mb-4">You are ready to learn this part.</p>
                    <button onclick="window.location.href='lesson.html'" class="bg-slate-900 text-white px-6 py-2.5 rounded-lg text-sm font-bold hover:bg-blue-600 transition-colors shadow-md">
                        Start Lesson &rarr;
                    </button>
                </div>
            </div>
        `;

        container.innerHTML = htmlStr;

        function finishForNow() {
            document.getElementById('roadmap-view').classList.add('hidden');
            document.getElementById('finished-view').classList.remove('hidden');
            
            let sid = localStorage.getItem("session_id") || "No Session";
            document.getElementById('display-session-id').innerText = sid;
        }

        function copySessionId() {
            navigator.clipboard.writeText(localStorage.getItem("session_id"));
            
            let btn = document.getElementById('copy-btn');
            let originalText = btn.innerText;
            btn.innerText = "Copied! ✅";
            btn.classList.replace('text-blue-600', 'text-green-700');
            btn.classList.replace('bg-blue-100', 'bg-green-100');
            
            setTimeout(() => {
                btn.innerText = originalText;
                btn.classList.replace('text-green-700', 'text-blue-600');
                btn.classList.replace('bg-green-100', 'bg-blue-100');
            }, 2000);
        }

        function closeSafely() {
            let btn = document.getElementById('close-btn');
            btn.innerText = "You can safely close this tab now 👋";
            btn.classList.replace('bg-slate-100', 'bg-emerald-100');
            btn.classList.replace('text-slate-700', 'text-emerald-800');
            btn.disabled = true;
        }
    </script>
</body>
</html>
